# Generation 6.0 Docker Compose Configuration
# Terragon SDLC Autonomous Implementation

version: '3.8'

networks:
  quantum-network:
    driver: bridge
    encrypt: true
  monitoring-network:
    driver: bridge

volumes:
  quantum-data:
    driver: local
  consciousness-models:
    driver: local
  evolution-cache:
    driver: local

services:
  consciousness-framework:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.consciousness
    container_name: terragon-consciousness-6
    environment:
      - CONSCIOUSNESS_LEVEL=METACOGNITIVE
      - QUANTUM_COHERENCE_ENABLED=true
      - SELF_AWARENESS_MODE=advanced
      - PROCESSING_DIMENSIONS=10
    volumes:
      - consciousness-models:/app/models
      - quantum-data:/app/quantum-data
    networks:
      - quantum-network
      - monitoring-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  evolution-engine:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.evolution
    container_name: terragon-evolution-6
    environment:
      - EVOLUTION_STRATEGY=GENETIC_QUANTUM_HYBRID
      - POPULATION_SIZE=100
      - MUTATION_RATE=0.05
      - ADAPTATION_ENABLED=true
    volumes:
      - evolution-cache:/app/evolution-data
      - quantum-data:/app/quantum-data
    networks:
      - quantum-network
      - monitoring-network
    ports:
      - "8081:8080"
    depends_on:
      - consciousness-framework
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/evolution/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  quantum-security:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.security
    container_name: terragon-security-6
    environment:
      - POST_QUANTUM_CRYPTO_ENABLED=true
      - ZERO_TRUST_MODE=strict
      - QUANTUM_KEY_DISTRIBUTION=true
      - THREAT_DETECTION_LEVEL=maximum
    networks:
      - quantum-network
      - monitoring-network
    ports:
      - "8443:8443"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/security/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  monitoring-system:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.monitoring
    container_name: terragon-monitoring-6
    environment:
      - DISTRIBUTED_TRACING_ENABLED=true
      - ANOMALY_DETECTION_SENSITIVITY=high
      - METRICS_COLLECTION_INTERVAL=10s
      - PREDICTIVE_ALERTING=true
    networks:
      - monitoring-network
    ports:
      - "3000:3000"  # Grafana
      - "9090:9090"  # Prometheus
      - "14268:14268"  # Jaeger
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
      - ./monitoring/prometheus:/etc/prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  performance-optimizer:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.optimizer
    container_name: terragon-optimizer-6
    environment:
      - QUANTUM_ANNEALING_ENABLED=true
      - OPTIMIZATION_ALGORITHM=quantum_hybrid
      - GLOBAL_OPTIMIZATION=true
      - RESOURCE_BALANCING=dynamic
    volumes:
      - quantum-data:/app/quantum-data
    networks:
      - quantum-network
      - monitoring-network
    ports:
      - "8082:8080"
    depends_on:
      - consciousness-framework
      - evolution-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/optimizer/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  multidimensional-engine:
    build:
      context: ../src/multimodal_contract_extractor
      dockerfile: Dockerfile.multidimensional
    container_name: terragon-multidimensional-6
    environment:
      - PROCESSING_DIMENSIONS=12
      - HYPERDIMENSIONAL_ANALYSIS=true
      - QUANTUM_SUPERPOSITION=enabled
      - DIMENSIONAL_COHERENCE_THRESHOLD=0.9
    volumes:
      - quantum-data:/app/quantum-data
      - consciousness-models:/app/models
    networks:
      - quantum-network
      - monitoring-network
    ports:
      - "8083:8080"
    depends_on:
      - consciousness-framework
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/multidimensional/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Load balancer for quantum-enhanced processing
  quantum-load-balancer:
    image: nginx:alpine
    container_name: terragon-lb-6
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - quantum-network
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - consciousness-framework
      - evolution-engine
      - quantum-security
      - performance-optimizer
      - multidimensional-engine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M