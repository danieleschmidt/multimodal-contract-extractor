# Generation 6.0 Production Deployment Configuration
# Terragon SDLC Autonomous Implementation

apiVersion: v1
kind: Namespace
metadata:
  name: terragon-generation-6
  labels:
    version: "6.0"
    tier: "production"
    quantum-enhanced: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consciousness-framework
  namespace: terragon-generation-6
spec:
  replicas: 3
  selector:
    matchLabels:
      app: consciousness-framework
  template:
    metadata:
      labels:
        app: consciousness-framework
        version: "6.0"
    spec:
      containers:
      - name: consciousness-framework
        image: terragon/consciousness-framework:6.0
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: CONSCIOUSNESS_LEVEL
          value: "METACOGNITIVE"
        - name: QUANTUM_COHERENCE_ENABLED
          value: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-engine
  namespace: terragon-generation-6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evolution-engine
  template:
    metadata:
      labels:
        app: evolution-engine
        version: "6.0"
    spec:
      containers:
      - name: evolution-engine
        image: terragon/evolution-engine:6.0
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: EVOLUTION_STRATEGY
          value: "GENETIC_QUANTUM_HYBRID"
        - name: ADAPTATION_RATE
          value: "0.1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-security
  namespace: terragon-generation-6
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantum-security
  template:
    metadata:
      labels:
        app: quantum-security
        version: "6.0"
    spec:
      containers:
      - name: quantum-security
        image: terragon/quantum-security:6.0
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: POST_QUANTUM_CRYPTO_ENABLED
          value: "true"
        - name: ZERO_TRUST_MODE
          value: "strict"
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-system
  namespace: terragon-generation-6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-system
  template:
    metadata:
      labels:
        app: monitoring-system
        version: "6.0"
    spec:
      containers:
      - name: monitoring-system
        image: terragon/monitoring-system:6.0
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: DISTRIBUTED_TRACING_ENABLED
          value: "true"
        - name: ANOMALY_DETECTION_SENSITIVITY
          value: "high"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-optimizer
  namespace: terragon-generation-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: performance-optimizer
  template:
    metadata:
      labels:
        app: performance-optimizer
        version: "6.0"
    spec:
      containers:
      - name: performance-optimizer
        image: terragon/performance-optimizer:6.0
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: QUANTUM_ANNEALING_ENABLED
          value: "true"
        - name: OPTIMIZATION_ALGORITHM
          value: "quantum_hybrid"

---
# Service configurations
apiVersion: v1
kind: Service
metadata:
  name: consciousness-framework-service
  namespace: terragon-generation-6
spec:
  selector:
    app: consciousness-framework
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: quantum-security-service
  namespace: terragon-generation-6
spec:
  selector:
    app: quantum-security
  ports:
  - port: 8443
    targetPort: 8443
  type: ClusterIP

---
# ConfigMaps for Generation 6.0 configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: generation-6-config
  namespace: terragon-generation-6
data:
  quantum_settings.yaml: |
    quantum:
      coherence_threshold: 0.95
      entanglement_strength: 0.8
      decoherence_time: 1000ms
    
    consciousness:
      awareness_levels: 7
      metacognitive_depth: 3
      self_reflection_interval: 30s
    
    evolution:
      mutation_rate: 0.05
      selection_pressure: 0.7
      population_size: 100
    
    security:
      post_quantum_algorithms:
        - "CRYSTALS-Kyber"
        - "CRYSTALS-Dilithium"
        - "FALCON"
      zero_trust_validation: true
      quantum_key_distribution: true

---
# Secrets for quantum cryptographic keys
apiVersion: v1
kind: Secret
metadata:
  name: quantum-keys
  namespace: terragon-generation-6
type: Opaque
data:
  quantum_master_key: <base64-encoded-quantum-key>
  post_quantum_cert: <base64-encoded-certificate>

---
# HorizontalPodAutoscaler for dynamic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consciousness-framework-hpa
  namespace: terragon-generation-6
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consciousness-framework
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# NetworkPolicy for quantum security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: generation-6-network-policy
  namespace: terragon-generation-6
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: terragon-generation-6
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: terragon-generation-6