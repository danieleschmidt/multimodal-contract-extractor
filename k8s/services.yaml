---
# Service Monitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mce-app-monitor
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    environment: production
spec:
  selector:
    matchLabels:
      app: mce-app
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace

---
# Pod Monitor for fine-grained monitoring
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mce-app-pod-monitor
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    environment: production
spec:
  selector:
    matchLabels:
      app: mce-app
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 15s
  - port: node-metrics
    path: /metrics
    interval: 30s

