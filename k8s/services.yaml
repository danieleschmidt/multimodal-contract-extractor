# Kubernetes Services Configuration for Production Deployment

apiVersion: v1
kind: Service
metadata:
  name: mce-app-service
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    version: "4.0.0"
    environment: production
    tier: application
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 8501
    targetPort: 8501
    protocol: TCP
  - name: api
    port: 8502
    targetPort: 8502
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: mce-app
    version: "4.0.0"
  sessionAffinity: None

---
# Service for GPU-enabled pods
apiVersion: v1
kind: Service
metadata:
  name: mce-app-gpu-service
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app-gpu
    version: "4.0.0"
    environment: production
    tier: application
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 8501
    targetPort: 8501
    protocol: TCP
  - name: api
    port: 8502
    targetPort: 8502
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: mce-app-gpu
    version: "4.0.0"

---
# Load Balancer Service for External Access
apiVersion: v1
kind: Service
metadata:
  name: mce-loadbalancer
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    version: "4.0.0"
    environment: production
    service-type: load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "3"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-west-2:123456789012:certificate/your-cert-id"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  ports:
  - name: http
    port: 80
    targetPort: 8501
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8501
    protocol: TCP
  - name: api
    port: 8443
    targetPort: 8502
    protocol: TCP
  selector:
    app: mce-app
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

