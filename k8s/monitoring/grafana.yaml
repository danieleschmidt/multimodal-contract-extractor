# Enterprise Grafana Deployment with Advanced Dashboards and Alerting

apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    
    [grafana_net]
    url = https://grafana.net
    
    [log]
    mode = console
    level = info
    
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    protocol = http
    http_port = 3000
    domain = monitoring.contract-extractor.example.com
    enforce_domain = false
    root_url = https://monitoring.contract-extractor.example.com/grafana/
    serve_from_sub_path = true
    
    [database]
    type = postgres
    host = postgres-service.multimodal-contract-extractor.svc.cluster.local:5432
    name = grafana_db
    user = grafana_user
    password = $__env{GF_DATABASE_PASSWORD}
    ssl_mode = require
    
    [session]
    provider = redis
    provider_config = addr=redis-service.multimodal-contract-extractor.svc.cluster.local:6379,pool_size=100,db=grafana
    cookie_name = grafana_sess
    cookie_secure = true
    session_life_time = 86400
    
    [dataproxy]
    logging = true
    timeout = 30
    send_user_header = true
    
    [auth]
    login_remember_days = 7
    login_maximum_inactive_lifetime_days = 30
    
    [auth.anonymous]
    enabled = false
    
    [auth.github]
    enabled = true
    allow_sign_up = true
    client_id = $__env{GF_AUTH_GITHUB_CLIENT_ID}
    client_secret = $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
    scopes = user:email,read:org
    auth_url = https://github.com/login/oauth/authorize
    token_url = https://github.com/login/oauth/access_token
    api_url = https://api.github.com/user
    allowed_organizations = your-org
    team_ids = 
    allowed_domains = example.com
    role_attribute_path = login=='admin' && 'Admin' || 'Viewer'
    
    [auth.generic_oauth]
    enabled = false
    name = OAuth
    allow_sign_up = true
    client_id = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    scopes = openid email profile
    auth_url = 
    token_url = 
    api_url = 
    
    [security]
    admin_user = admin
    admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}
    secret_key = $__env{GF_SECURITY_SECRET_KEY}
    login_remember_days = 7
    cookie_secure = true
    cookie_samesite = strict
    allow_embedding = false
    strict_transport_security = true
    strict_transport_security_max_age_seconds = 86400
    strict_transport_security_preload = true
    strict_transport_security_subdomains = true
    x_content_type_options = true
    x_xss_protection = true
    
    [snapshots]
    external_enabled = false
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/home.json
    
    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_id = 1
    auto_assign_org_role = Viewer
    verify_email_enabled = true
    login_hint = email or username
    default_theme = dark
    
    [emails]
    welcome_email_on_sign_up = true
    templates_pattern = emails/*.html
    
    [smtp]
    enabled = true
    host = $__env{GF_SMTP_HOST}
    user = $__env{GF_SMTP_USER}
    password = $__env{GF_SMTP_PASSWORD}
    cert_file = 
    key_file = 
    skip_verify = false
    from_address = grafana@example.com
    from_name = MCE Grafana
    ehlo_identity = 
    
    [alerting]
    enabled = true
    execute_alerts = true
    error_or_timeout = alerting
    nodata_or_nullvalues = no_data
    concurrent_render_limit = 5
    evaluation_timeout_seconds = 30
    notification_timeout_seconds = 30
    max_attempts = 3
    min_interval_seconds = 1
    
    [unified_alerting]
    enabled = true
    ha_listen_address = "${POD_IP}:9094"
    ha_advertise_address = "${POD_IP}:9094"
    ha_peers = "grafana-0.grafana-headless.monitoring.svc.cluster.local:9094,grafana-1.grafana-headless.monitoring.svc.cluster.local:9094"
    ha_peer_timeout = 15s
    ha_gossip_interval = 200ms
    ha_push_pull_interval = 60s
    ha_redis_address = "redis-service.multimodal-contract-extractor.svc.cluster.local:6379"
    
    [metrics]
    enabled = true
    interval_seconds = 10
    disable_total_stats = false
    basic_auth_username = 
    basic_auth_password = 
    
    [tracing.jaeger]
    address = jaeger-service.monitoring.svc.cluster.local:6831
    always_included_tag = 
    sampler_type = probabilistic
    sampler_param = 0.1
    
    [explore]
    enabled = true
    
    [help]
    enabled = true
    
    [profile]
    enabled = true
    
    [feature_toggles]
    enable = publicDashboards,tempoApmTable
    
    [date_formats]
    default_timezone = UTC
    
    [panels]
    disable_sanitize_html = false
    
    [plugins]
    enable_alpha = false
    app_tls_skip_verify_insecure = false
    allow_loading_unsigned_plugins = false
    
    [enterprise]
    license_path = /etc/grafana/license/license.jwt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-operated.monitoring.svc.cluster.local:9090
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
        queryTimeout: 60s
        
    - name: Alertmanager
      type: alertmanager
      access: proxy
      url: http://alertmanager-operated.monitoring.svc.cluster.local:9093
      editable: true
      jsonData:
        implementation: prometheus
        
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger-service.monitoring.svc.cluster.local:16686
      editable: true
      
    - name: Elasticsearch
      type: elasticsearch
      access: proxy
      url: http://elasticsearch-service.monitoring.svc.cluster.local:9200
      database: mce-logs-*
      editable: true
      jsonData:
        interval: Daily
        timeField: '@timestamp'
        esVersion: 8.0.0
        maxConcurrentShardRequests: 256
        
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      editable: true
      jsonData:
        authType: default
        defaultRegion: us-west-2
        customMetricsNamespaces: MCE/Application,AWS/EKS
        assumeRoleArn: arn:aws:iam::ACCOUNT_ID:role/GrafanaCloudWatchRole
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  GF_SECURITY_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  GF_DATABASE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  GF_AUTH_GITHUB_CLIENT_ID: ""
  GF_AUTH_GITHUB_CLIENT_SECRET: ""
  GF_SMTP_HOST: "smtp.example.com:587"
  GF_SMTP_USER: "grafana@example.com"
  GF_SMTP_PASSWORD: ""
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    version: "10.1.0"
spec:
  serviceName: grafana-headless
  replicas: 2
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - grafana
              topologyKey: kubernetes.io/hostname

      initContainers:
      - name: init-permissions
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          chown -R 472:472 /var/lib/grafana
          chmod -R 755 /var/lib/grafana
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana

      containers:
      - name: grafana
        image: grafana/grafana-enterprise:10.1.0
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 9094
          name: gossip
        
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        envFrom:
        - secretRef:
            name: grafana-secrets

        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 472

      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards

  volumeClaimTemplates:
  - metadata:
      name: grafana-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: gossip
    port: 9094
    targetPort: 9094
  selector:
    app: grafana
---
# Dashboard Provisioning Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: default
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
        foldersFromFilesStructure: true
---
# MCE Application Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  mce-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "MCE Application Overview",
        "tags": ["mce", "application", "overview"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"mce-app\"}[5m]))",
                "legendFormat": "Requests/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Response Time (95th percentile)",
            "type": "stat",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"mce-app\"}[5m])) by (le))",
                "legendFormat": "95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"mce-app\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"mce-app\"}[5m])) * 100",
                "legendFormat": "Error %"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0}
          },
          {
            "id": 4,
            "title": "Active Pods",
            "type": "stat",
            "targets": [
              {
                "expr": "count(up{job=\"mce-app\"} == 1)",
                "legendFormat": "Active Pods"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0}
          },
          {
            "id": 5,
            "title": "Document Processing Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(documents_processed_total[5m])",
                "legendFormat": "Documents/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 6,
            "title": "Clause Detection Accuracy",
            "type": "graph",
            "targets": [
              {
                "expr": "avg_over_time(clause_detection_accuracy[5m])",
                "legendFormat": "Accuracy"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  kubernetes-cluster.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Kubernetes Cluster Overview",
        "tags": ["kubernetes", "cluster", "infrastructure"],
        "panels": [
          {
            "id": 1,
            "title": "Cluster CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                "legendFormat": "CPU Usage %"
              }
            ]
          }
        ]
      }
    }