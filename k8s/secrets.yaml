# Kubernetes Secrets Management for Production Deployment
# This template should be populated with actual values and encrypted in production

apiVersion: v1
kind: Secret
metadata:
  name: mce-database-credentials
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: database
  annotations:
    kubernetes.io/managed-by: "external-secrets-operator"
type: Opaque
stringData:
  # Database credentials - Replace with actual values
  POSTGRES_USER: "mce_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "mce_db"
  DATABASE_URL: "postgresql://mce_user:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/mce_db"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: mce-redis-credentials
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_URL: "redis://:CHANGE_ME_IN_PRODUCTION@redis-service:6379/0"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: mce-app-secrets
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: application
type: Opaque
stringData:
  # Application secrets
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_STRING"
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_JWT_SECRET"
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION_32_BYTE_KEY"
  
  # API Keys (if needed)
  OPENAI_API_KEY: ""
  HUGGINGFACE_API_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  
  # External service credentials
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""
  GCP_SERVICE_ACCOUNT_KEY: ""
  
---
apiVersion: v1
kind: Secret
metadata:
  name: mce-monitoring-secrets
  namespace: multimodal-contract-extractor
  labels:
    app: monitoring
    secret-type: monitoring
type: Opaque
stringData:
  # Grafana credentials
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Prometheus credentials (if auth enabled)
  PROMETHEUS_USER: "prometheus"
  PROMETHEUS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # AlertManager secrets
  ALERTMANAGER_CLUSTER_KEY: "CHANGE_ME_IN_PRODUCTION"
  SLACK_API_URL: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  PAGERDUTY_ROUTING_KEY: "YOUR_PAGERDUTY_ROUTING_KEY"
  
---
# TLS Certificate Secret
apiVersion: v1
kind: Secret
metadata:
  name: mce-tls-cert
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Generate with: kubectl create secret tls mce-tls-cert --cert=path/to/cert.pem --key=path/to/key.pem
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # Replace with actual certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t  # Replace with actual private key
  
---
# Service Account Token Secret for External Services
apiVersion: v1
kind: Secret
metadata:
  name: mce-service-account
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: service-account
  annotations:
    kubernetes.io/service-account.name: mce-app
type: kubernetes.io/service-account-token

---
# Docker Registry Secret (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: mce-registry-secret
  namespace: multimodal-contract-extractor
  labels:
    app: mce-app
    secret-type: registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6InVzZXIiLCJwYXNzd29yZCI6InBhc3MiLCJhdXRoIjoiZFhObGNqcHdZWE56In19fQ==

---
# Vault Configuration Secret
apiVersion: v1
kind: Secret
metadata:
  name: vault-config
  namespace: multimodal-contract-extractor
  labels:
    app: vault
    secret-type: vault
type: Opaque
stringData:
  vault.hcl: |
    ui = true
    
    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_disable = 1
    }
    
    storage "file" {
      path = "/vault/data"
    }
    
    api_addr = "http://vault-service:8200"
    cluster_addr = "http://vault-service:8201"
    
    # Enable audit logging
    audit {
      file {
        file_path = "/vault/logs/audit.log"
        log_raw = true
      }
    }
    
    # Seal configuration for auto-unseal (production)
    seal "awskms" {
      region     = "us-west-2"
      kms_key_id = "your-kms-key-id"
    }

---
# External Secrets Configuration (if using external-secrets-operator)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: multimodal-contract-extractor
spec:
  provider:
    vault:
      server: "http://vault-service:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mce-app"
          serviceAccountRef:
            name: "mce-app"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mce-external-secrets
  namespace: multimodal-contract-extractor
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: mce-vault-secrets
    creationPolicy: Owner
  data:
  - secretKey: database-password
    remoteRef:
      key: mce/database
      property: password
  - secretKey: redis-password
    remoteRef:
      key: mce/redis
      property: password
  - secretKey: app-secret-key
    remoteRef:
      key: mce/app
      property: secret-key

---
# Certificate Manager Configuration
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mce-tls-certificate
  namespace: multimodal-contract-extractor
spec:
  secretName: mce-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: contract-extractor.example.com
  dnsNames:
  - contract-extractor.example.com
  - api.contract-extractor.example.com
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days

---
# Cluster Issuer for Let's Encrypt (production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx