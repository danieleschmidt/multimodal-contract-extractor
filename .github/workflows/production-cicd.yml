# Production CI/CD Pipeline with Blue-Green Deployment and Canary Releases
# Advanced deployment strategies for enterprise-grade legal AI system

name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    # Daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

# Security-first environment variables
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mce-app
  PYTHON_VERSION: '3.11.8'
  NODE_VERSION: '18'
  
  # Deployment settings
  PRODUCTION_CLUSTER: mce-prod-cluster
  STAGING_CLUSTER: mce-staging-cluster
  PRODUCTION_NAMESPACE: multimodal-contract-extractor
  
  # Security settings
  COSIGN_EXPERIMENTAL: 1
  TRIVY_VERSION: 0.47.0
  SYFT_VERSION: 0.95.0

# Permissions following least-privilege principle
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  # ==========================================================================
  # SECURITY & COMPLIANCE CHECKS
  # ==========================================================================
  
  security-scan:
    name: Security & Compliance Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    outputs:
      security-passed: ${{ steps.security-check.outputs.passed }}
      vulnerability-count: ${{ steps.trivy-scan.outputs.vulnerability-count }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    # Secret scanning
    - name: Run Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
        
    # SAST Analysis
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: python, javascript
        queries: security-extended,security-and-quality
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      
    # Dependency vulnerability scanning
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        
    - name: Run Safety Check
      run: |
        pip install safety
        safety check --json --output safety-report.json
        safety check
      continue-on-error: true
      
    - name: Run Bandit Security Linter
      run: |
        pip install bandit[toml]
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/
      continue-on-error: true
      
    - name: Run Semgrep Static Analysis
      uses: returntocorp/semgrep-action@v1
      with:
        config: auto
        generateSarif: "1"
        
    # Container security scanning
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Security Test Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        target: production-cpu
        push: false
        tags: mce-security-test:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run Trivy Container Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: mce-security-test:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        
    - name: Upload Trivy Results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run Container Structure Test
      run: |
        curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
        chmod +x container-structure-test-linux-amd64
        sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
        container-structure-test test --image mce-security-test:latest --config tests/container-structure-test.yaml
        
    - name: Security Check Summary
      id: security-check
      run: |
        echo "Security scan completed"
        echo "passed=true" >> $GITHUB_OUTPUT
        
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          trivy-results.sarif
        retention-days: 30

  # ==========================================================================
  # COMPREHENSIVE TESTING
  # ==========================================================================
  
  test-suite:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 45
    
    strategy:
      matrix:
        python-version: ['3.11.8']
        test-type: ['unit', 'integration', 'e2e']
        
    services:
      postgres:
        image: postgres:15.4-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage-percentage }}
      test-results: ${{ steps.test-results.outputs.results }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt -r requirements-gpu.txt
        
    - name: Set up Test Environment
      run: |
        cp config.example.yml config.yml
        export DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
        export REDIS_URL=redis://localhost:6379/1
        export MCE_ENVIRONMENT=testing
        
    - name: Run Database Migrations
      run: |
        export DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
        python -m alembic upgrade head
        
    # Run specific test types
    - name: Run Unit Tests
      if: matrix.test-type == 'unit'
      run: |
        python -m pytest tests/unit/ -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=junit-unit.xml \
          --tb=short
          
    - name: Run Integration Tests  
      if: matrix.test-type == 'integration'
      run: |
        python -m pytest tests/integration/ -v \
          --cov=src \
          --cov-append \
          --cov-report=xml \
          --junitxml=junit-integration.xml \
          --tb=short
          
    - name: Run End-to-End Tests
      if: matrix.test-type == 'e2e'
      run: |
        python -m pytest tests/e2e/ -v \
          --cov=src \
          --cov-append \
          --cov-report=xml \
          --junitxml=junit-e2e.xml \
          --tb=short
          
    # Performance testing
    - name: Run Performance Tests
      if: matrix.test-type == 'integration'
      run: |
        python -m pytest tests/performance/ -v \
          --benchmark-only \
          --benchmark-json=benchmark-results.json
          
    # Load testing
    - name: Run Load Tests
      if: matrix.test-type == 'e2e'
      run: |
        pip install locust
        python performance/load_testing.py --headless -u 10 -r 2 -t 60s --host http://localhost:8501
        
    - name: Calculate Coverage
      id: coverage
      if: matrix.test-type == 'unit'
      run: |
        coverage report --show-missing
        COVERAGE=$(coverage report --format=total)
        echo "coverage-percentage=${COVERAGE}" >> $GITHUB_OUTPUT
        
    - name: Upload Coverage to Codecov
      if: matrix.test-type == 'unit'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        
    - name: Test Results Summary
      id: test-results
      run: |
        echo "Test type: ${{ matrix.test-type }}"
        echo "results=passed" >> $GITHUB_OUTPUT
        
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.test-type }}
        path: |
          junit-*.xml
          htmlcov/
          benchmark-results.json
        retention-days: 30

  # ==========================================================================
  # BUILD & PACKAGE
  # ==========================================================================
  
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    needs: [security-scan, test-suite]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60
    
    outputs:
      image-cpu: ${{ steps.meta.outputs.tags-cpu }}
      image-gpu: ${{ steps.meta.outputs.tags-gpu }}
      digest-cpu: ${{ steps.build-cpu.outputs.digest }}
      digest-gpu: ${{ steps.build-gpu.outputs.digest }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host
        
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Multimodal Contract Extractor
          org.opencontainers.image.description=Production-ready legal AI system
          org.opencontainers.image.vendor=MCE Team
          
    # Build CPU image
    - name: Build and Push CPU Image
      id: build-cpu
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        target: production-cpu
        push: true
        tags: ${{ steps.meta.outputs.tags }}-cpu
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=cpu
        cache-to: type=gha,mode=max,scope=cpu
        platforms: linux/amd64,linux/arm64
        build-args: |
          PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          SECURITY_SCAN=true
          
    # Build GPU image
    - name: Build and Push GPU Image
      id: build-gpu
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        target: production-gpu
        push: true
        tags: ${{ steps.meta.outputs.tags }}-gpu
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=gpu
        cache-to: type=gha,mode=max,scope=gpu
        platforms: linux/amd64
        build-args: |
          CUDA_VERSION=12.1.1
          SECURITY_SCAN=true
          
    # Sign container images
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3
      
    - name: Sign CPU Container Image
      run: |
        echo "${{ steps.meta.outputs.tags }}-cpu" | xargs -I {} cosign sign --yes {}@${{ steps.build-cpu.outputs.digest }}
        
    - name: Sign GPU Container Image
      run: |
        echo "${{ steps.meta.outputs.tags }}-gpu" | xargs -I {} cosign sign --yes {}@${{ steps.build-gpu.outputs.digest }}
        
    # Generate SBOM
    - name: Generate SBOM for CPU Image
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-cpu.outputs.digest }}
        format: spdx-json
        output-file: sbom-cpu.spdx.json
        
    - name: Generate SBOM for GPU Image
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-gpu.outputs.digest }}
        format: spdx-json
        output-file: sbom-gpu.spdx.json
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          sbom-*.spdx.json
        retention-days: 90

  # ==========================================================================
  # STAGING DEPLOYMENT
  # ==========================================================================
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    timeout-minutes: 30
    
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
      health-status: ${{ steps.health-check.outputs.status }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-west-2 --name ${{ env.STAGING_CLUSTER }}
        
    - name: Deploy to Staging
      id: deploy
      run: |
        # Update image tags in Kubernetes manifests
        sed -i "s|image: mce-app:.*|image: ${{ needs.build-and-push.outputs.image-cpu }}|g" k8s/deployment.yaml
        
        # Apply configurations
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/services.yaml
        kubectl apply -f k8s/ingress.yaml
        
        # Wait for rollout
        kubectl rollout status deployment/mce-app -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=600s
        
        # Get service URL
        URL=$(kubectl get ingress mce-ingress -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        echo "url=https://${URL}" >> $GITHUB_OUTPUT
        
    - name: Run Staging Health Checks
      id: health-check
      run: |
        # Wait for application to be ready
        sleep 60
        
        # Check application health
        curl -f ${{ steps.deploy.outputs.url }}/health || exit 1
        
        # Check API health
        curl -f ${{ steps.deploy.outputs.url }}/api/health || exit 1
        
        echo "status=healthy" >> $GITHUB_OUTPUT
        
    - name: Run Smoke Tests
      run: |
        # Run basic smoke tests against staging
        python tests/smoke_tests.py --endpoint ${{ steps.deploy.outputs.url }}

  # ==========================================================================
  # PRODUCTION DEPLOYMENT (BLUE-GREEN)
  # ==========================================================================
  
  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    timeout-minutes: 45
    
    outputs:
      deployment-status: ${{ steps.blue-green.outputs.status }}
      rollback-available: ${{ steps.blue-green.outputs.rollback-available }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: us-west-2
        role-to-assume: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}
        
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-west-2 --name ${{ env.PRODUCTION_CLUSTER }}
        
    - name: Blue-Green Deployment
      id: blue-green
      run: |
        # Determine current and target environments
        CURRENT_ENV=$(kubectl get deployment mce-app -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.metadata.labels.deployment-slot}' || echo "blue")
        TARGET_ENV=$([[ "$CURRENT_ENV" == "blue" ]] && echo "green" || echo "blue")
        
        echo "Current environment: $CURRENT_ENV"
        echo "Target environment: $TARGET_ENV"
        
        # Deploy to target environment
        sed -i "s|image: mce-app:.*|image: ${{ needs.build-and-push.outputs.image-cpu }}|g" k8s/deployment.yaml
        sed -i "s|name: mce-app|name: mce-app-${TARGET_ENV}|g" k8s/deployment.yaml
        sed -i "s|app: mce-app|app: mce-app-${TARGET_ENV}|g" k8s/deployment.yaml
        
        # Add deployment slot label
        kubectl patch deployment mce-app-${TARGET_ENV} -n ${{ env.PRODUCTION_NAMESPACE }} -p '{"metadata":{"labels":{"deployment-slot":"'${TARGET_ENV}'"}}}'
        
        # Apply target deployment
        kubectl apply -f k8s/deployment.yaml
        kubectl rollout status deployment/mce-app-${TARGET_ENV} -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=600s
        
        # Health check target environment
        sleep 30
        TARGET_IP=$(kubectl get pods -l app=mce-app-${TARGET_ENV} -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.items[0].status.podIP}')
        kubectl run health-check --image=curlimages/curl --rm -it --restart=Never -- curl -f http://${TARGET_IP}:8501/health
        
        # Switch traffic (update service selector)
        kubectl patch service mce-app-service -n ${{ env.PRODUCTION_NAMESPACE }} -p '{"spec":{"selector":{"app":"mce-app-'${TARGET_ENV}'"}}}'
        
        echo "status=deployed" >> $GITHUB_OUTPUT
        echo "rollback-available=true" >> $GITHUB_OUTPUT
        echo "current-slot=${TARGET_ENV}" >> $GITHUB_OUTPUT
        echo "previous-slot=${CURRENT_ENV}" >> $GITHUB_OUTPUT
        
    - name: Post-Deployment Verification
      run: |
        # Wait for traffic switch
        sleep 60
        
        # Verify production health
        PROD_URL=$(kubectl get ingress mce-ingress -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        curl -f https://${PROD_URL}/health
        curl -f https://${PROD_URL}/api/health
        
        # Run production smoke tests
        python tests/smoke_tests.py --endpoint https://${PROD_URL} --production
        
    - name: Cleanup Old Deployment
      if: success()
      run: |
        # Wait additional time before cleanup
        sleep 300
        
        # Scale down old deployment
        PREVIOUS_SLOT=${{ steps.blue-green.outputs.previous-slot }}
        kubectl scale deployment mce-app-${PREVIOUS_SLOT} -n ${{ env.PRODUCTION_NAMESPACE }} --replicas=0
        
        # Keep old deployment for potential quick rollback
        echo "Old deployment scaled down but preserved for rollback"

  # ==========================================================================
  # CANARY DEPLOYMENT (ALTERNATIVE STRATEGY)
  # ==========================================================================
  
  canary-deployment:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[canary]')
    environment: production
    timeout-minutes: 60
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: us-west-2
        
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-west-2 --name ${{ env.PRODUCTION_CLUSTER }}
        
    - name: Deploy Canary (10% traffic)
      run: |
        # Deploy canary version
        sed -i "s|image: mce-app:.*|image: ${{ needs.build-and-push.outputs.image-cpu }}|g" k8s/deployment.yaml
        sed -i "s|name: mce-app|name: mce-app-canary|g" k8s/deployment.yaml
        sed -i "s|app: mce-app|app: mce-app-canary|g" k8s/deployment.yaml
        sed -i "s|replicas: 3|replicas: 1|g" k8s/deployment.yaml
        
        kubectl apply -f k8s/deployment.yaml
        kubectl rollout status deployment/mce-app-canary -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=600s
        
        # Configure traffic split (requires service mesh)
        kubectl apply -f - <<EOF
        apiVersion: networking.istio.io/v1beta1
        kind: VirtualService
        metadata:
          name: mce-canary-vs
          namespace: ${{ env.PRODUCTION_NAMESPACE }}
        spec:
          hosts:
          - mce-app-service
          http:
          - match:
            - headers:
                canary:
                  exact: "true"
            route:
            - destination:
                host: mce-app-service
                subset: canary
              weight: 100
          - route:
            - destination:
                host: mce-app-service
                subset: stable
              weight: 90
            - destination:
                host: mce-app-service
                subset: canary
              weight: 10
        EOF
        
    - name: Monitor Canary Metrics
      run: |
        # Monitor for 30 minutes
        for i in {1..30}; do
          echo "Monitoring canary deployment (minute $i/30)"
          
          # Check error rate
          ERROR_RATE=$(curl -s "http://prometheus:9090/api/v1/query?query=rate(http_requests_total{app=\"mce-app-canary\",status=~\"5..\"}[5m])/rate(http_requests_total{app=\"mce-app-canary\"}[5m])" | jq -r '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "High error rate detected: $ERROR_RATE"
            echo "Rolling back canary deployment"
            kubectl delete deployment mce-app-canary -n ${{ env.PRODUCTION_NAMESPACE }}
            kubectl delete virtualservice mce-canary-vs -n ${{ env.PRODUCTION_NAMESPACE }}
            exit 1
          fi
          
          sleep 60
        done
        
    - name: Promote Canary to Production
      if: success()
      run: |
        # Gradually increase canary traffic
        for weight in 25 50 75 100; do
          echo "Increasing canary traffic to ${weight}%"
          
          kubectl patch virtualservice mce-canary-vs -n ${{ env.PRODUCTION_NAMESPACE }} --type='json' \
            -p="[{'op': 'replace', 'path': '/spec/http/1/route/0/weight', 'value': $((100-weight))}, \
                 {'op': 'replace', 'path': '/spec/http/1/route/1/weight', 'value': ${weight}}]"
          
          sleep 300  # Wait 5 minutes between increases
          
          # Monitor metrics
          ERROR_RATE=$(curl -s "http://prometheus:9090/api/v1/query?query=rate(http_requests_total{app=\"mce-app-canary\",status=~\"5..\"}[5m])/rate(http_requests_total{app=\"mce-app-canary\"}[5m])" | jq -r '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "High error rate detected during promotion: $ERROR_RATE"
            exit 1
          fi
        done
        
        # Replace stable deployment with canary
        kubectl scale deployment mce-app -n ${{ env.PRODUCTION_NAMESPACE }} --replicas=0
        kubectl patch deployment mce-app-canary -n ${{ env.PRODUCTION_NAMESPACE }} -p '{"metadata":{"name":"mce-app"}}'
        kubectl delete virtualservice mce-canary-vs -n ${{ env.PRODUCTION_NAMESPACE }}

  # ==========================================================================
  # POST-DEPLOYMENT MONITORING
  # ==========================================================================
  
  post-deployment-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60
    
    steps:
    - name: Monitor Production Health
      run: |
        echo "Monitoring production deployment for 1 hour"
        
        for i in {1..60}; do
          echo "Health check $i/60"
          
          # Get production URL
          PROD_URL=$(kubectl get ingress mce-ingress -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Health checks
          if ! curl -sf https://${PROD_URL}/health > /dev/null; then
            echo "Health check failed at minute $i"
            exit 1
          fi
          
          # Check key metrics
          ERROR_RATE=$(curl -s "http://prometheus:9090/api/v1/query?query=rate(http_requests_total{job=\"mce-app\",status=~\"5..\"}[5m])/rate(http_requests_total{job=\"mce-app\"}[5m])" | jq -r '.data.result[0].value[1] // 0')
          RESPONSE_TIME=$(curl -s "http://prometheus:9090/api/v1/query?query=histogram_quantile(0.95,rate(http_request_duration_seconds_bucket{job=\"mce-app\"}[5m]))" | jq -r '.data.result[0].value[1] // 0')
          
          if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
            echo "High error rate detected: $ERROR_RATE"
            exit 1
          fi
          
          if (( $(echo "$RESPONSE_TIME > 10" | bc -l) )); then
            echo "High response time detected: $RESPONSE_TIME"
            exit 1
          fi
          
          sleep 60
        done
        
        echo "Post-deployment monitoring completed successfully"

  # ==========================================================================
  # ROLLBACK CAPABILITY
  # ==========================================================================
  
  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.outputs.rollback-available == 'true'
    needs: [deploy-production, post-deployment-monitoring]
    environment: production
    timeout-minutes: 15
    
    steps:
    - name: Emergency Rollback
      run: |
        echo "Performing emergency rollback"
        
        # Configure kubectl
        aws eks update-kubeconfig --region us-west-2 --name ${{ env.PRODUCTION_CLUSTER }}
        
        # Get previous slot
        PREVIOUS_SLOT=${{ needs.deploy-production.outputs.previous-slot }}
        CURRENT_SLOT=${{ needs.deploy-production.outputs.current-slot }}
        
        # Scale up previous deployment
        kubectl scale deployment mce-app-${PREVIOUS_SLOT} -n ${{ env.PRODUCTION_NAMESPACE }} --replicas=3
        kubectl rollout status deployment/mce-app-${PREVIOUS_SLOT} -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=300s
        
        # Switch traffic back
        kubectl patch service mce-app-service -n ${{ env.PRODUCTION_NAMESPACE }} -p '{"spec":{"selector":{"app":"mce-app-'${PREVIOUS_SLOT}'"}}}'
        
        # Scale down failed deployment
        kubectl scale deployment mce-app-${CURRENT_SLOT} -n ${{ env.PRODUCTION_NAMESPACE }} --replicas=0
        
        echo "Rollback completed successfully"

  # ==========================================================================
  # NOTIFICATIONS
  # ==========================================================================
  
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-monitoring]
    if: always()
    
    steps:
    - name: Send Slack Notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#mce-deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        custom_payload: |
          {
            "text": "MCE Production Deployment ${{ job.status }}",
            "attachments": [{
              "color": "${{ job.status }}" === "success" ? "good" : "danger",
              "fields": [{
                "title": "Repository",
                "value": "${{ github.repository }}",
                "short": true
              }, {
                "title": "Version",
                "value": "${{ github.ref_name }}",
                "short": true
              }, {
                "title": "Commit",
                "value": "${{ github.sha }}",
                "short": true
              }, {
                "title": "Status",
                "value": "${{ job.status }}",
                "short": true
              }]
            }]
          }