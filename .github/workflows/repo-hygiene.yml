name: Repository Hygiene Bot

on:
  schedule:
    # Run weekly on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Specific repository to process (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: false
        type: boolean

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hygiene.txt
          
      - name: Run hygiene bot
        env:
          GITHUB_TOKEN: ${{ secrets.HYGIENE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          args=""
          if [ "${{ github.event.inputs.repository }}" != "" ]; then
            args="--repo ${{ github.event.inputs.repository }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          
          python repo_hygiene_bot.py $args
          
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-results
          path: |
            hygiene-results.json
            hygiene-log.txt
          retention-days: 30