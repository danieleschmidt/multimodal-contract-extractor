# Trivy secret scanning configuration
# Customize secret detection rules

# Allowlist for false positives
rules:
  - id: aws-access-key-id
    allowlist:
      paths:
        - "**/*test*"
        - "**/tests/**"
      keywords:
        - "EXAMPLE"
        - "example"
        - "dummy"
        - "test"
        - "fake"
  
  - id: aws-secret-access-key  
    allowlist:
      paths:
        - "**/*test*"
        - "**/tests/**"
      keywords:
        - "EXAMPLE"
        - "example"
        - "dummy"
        - "test"
        - "fake"

  - id: github-pat
    allowlist:
      paths:
        - "**/*test*"
        - "**/tests/**"
      keywords:
        - "EXAMPLE"
        - "example"
        - "dummy"
        - "test"
        - "fake"

# Additional custom rules can be added here
# See: https://aquasecurity.github.io/trivy/latest/docs/secret/