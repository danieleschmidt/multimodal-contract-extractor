[pytest]
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=src/multimodal_contract_extractor
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=5
    --durations=10
    --tb=short
    --maxfail=5

# Directory containing tests
testpaths = tests

# Minimum version
minversion = 7.4

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-related
    performance: marks tests as performance benchmarks
    gpu: marks tests requiring GPU
    api: marks tests as API endpoint tests
    database: marks tests requiring database
    cache: marks tests for caching functionality
    ocr: marks tests for OCR processing
    contract: marks tests for contract processing
    validation: marks tests for input validation
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    asyncio: marks tests as async/asyncio tests
    
# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
