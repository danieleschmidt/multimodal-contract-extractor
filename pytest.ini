[pytest]
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90
    --durations=10
    --tb=short
    --maxfail=5
    -v

# Directory containing tests
testpaths = tests

# Minimum version
minversion = 8.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-related
    performance: marks tests as performance benchmarks
    gpu: marks tests requiring GPU
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    contract_validation: marks tests for contract validation
    cli: marks tests for CLI functionality
    web: marks tests for web interface
    api: marks tests for API functionality
    
# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PytestUnraisableExceptionWarning
    ignore::ResourceWarning

# Test timeout (in seconds)
timeout = 300

# Parallel execution
addopts = --numprocesses=auto
markers =
    serial: marks tests to run serially (not in parallel)
